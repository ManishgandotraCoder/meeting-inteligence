[project]
name = "meeting-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for Smart Meet"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.1",
  "uvicorn[standard]>=0.35.0",
  "sqlalchemy>=2.0.43",
  "greenlet>=3.0.0",
  "asyncpg>=0.30.0",
  "pgvector>=0.4.1",
  "alembic>=1.16.5",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.10.1",
  "python-multipart>=0.0.20",
  "openai>=1.102.0",
  "structlog>=25.4.0",
  "faster-whisper>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "httpx>=0.28.1",
  "ruff>=0.12.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
